version: 2
updates:
  # GitHub Actions（.github/workflows を走査）。SHA 固定はそのまま SHA を更新する
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # npm（pnpm workspace 全体を走査。pnpm-lock.yaml に対応）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types:
          - minor
          - patch
