name: CI

on:
  pull_request:
  push:
    branches: [main]

# デフォルトは権限なし。各 job で必要最小限だけ付与する
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: make check (ruff lint + format)
        run: make check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: docker compose build
        run: docker compose build

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Actions がコミットハッシュで固定されているか検証する（fix せず検証のみ）
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@28aeb220eb3252ad0d4422dd5d9368e925acbd8d # v1.3.0
        with:
          skip_push: "true" # push せず検証のみ。未固定なら CI を fail させる
          verify: "true" # バージョンコメントと SHA の整合も検証する

  # ワークフロー YAML の静的検査
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: actionlint -color

  # GitHub Actions のセキュリティスキャン（インジェクション・過剰権限等）
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.26.1 .github/

  # 集約チェック（種類ごと）。Ruleset の必須チェックはこの 2 つ（ci / security）だけにする。
  # 個別ジョブを増減してもこの gate が束ねるため Ruleset 側の変更は不要。
  # 注意: 新しいジョブを追加したら、必ずいずれかの gate の needs に加えること。
  #       加え忘れると、そのジョブが落ちても必須チェックは通りマージできてしまう。
  ci:
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: Verify app jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "lint=$LINT build=$BUILD"
          [ "$LINT" = success ] && [ "$BUILD" = success ]

  security:
    needs: [gitleaks, pinact, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: Verify security jobs passed
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          PINACT: ${{ needs.pinact.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          echo "gitleaks=$GITLEAKS pinact=$PINACT actionlint=$ACTIONLINT zizmor=$ZIZMOR"
          [ "$GITLEAKS" = success ] && [ "$PINACT" = success ] \
            && [ "$ACTIONLINT" = success ] && [ "$ZIZMOR" = success ]
